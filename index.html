<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Gir Kitchenware Studio - Admin Panel</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f6f8;
      color: #222;
    }

    /* LOGIN */
    #loginBox {
      width: 100%;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 35px;
      border-radius: 18px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
    }

    .login-card h1 {
      text-align: center;
      margin-bottom: 8px;
      color: #d35400;
    }

    .login-card p {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 8px;
      margin-top: 7px;
      margin-bottom: 15px;
      font-size: 15px;
      outline: none;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #d35400;
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    label {
      font-weight: 600;
      display: block;
      margin-top: 5px;
    }

    button {
      border: none;
      cursor: pointer;
      border-radius: 8px;
      padding: 12px 18px;
      font-size: 15px;
      font-weight: 600;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #loginBtn {
      width: 100%;
      background: #d35400;
      color: white;
      margin-top: 5px;
    }

    #loginBtn:hover {
      background: #b94700;
    }

    #loginMessage {
      text-align: center;
      color: #d35400;
      margin-top: 15px;
      min-height: 20px;
    }

    /* DASHBOARD */

    #dashboard {
      display: none;
      min-height: 100vh;
    }

    .topbar {
      background: #d35400;
      color: white;
      padding: 16px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .topbar h2 {
      font-size: 22px;
    }

    #logoutBtn {
      background: white;
      color: #d35400;
    }

    #logoutBtn:hover {
      background: #f2f2f2;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      margin: auto;
      padding: 25px;
    }

    /* FORM */

    .form-card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.07);
      margin-bottom: 30px;
    }

    .form-card h2 {
      margin-bottom: 20px;
      color: #d35400;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .photo-preview {
      width: 180px;
      height: 180px;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid #ddd;
      display: none;
      margin-bottom: 15px;
    }

    .buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    #saveBtn {
      background: #27ae60;
      color: white;
    }

    #saveBtn:hover {
      background: #219150;
    }

    #cancelBtn {
      background: #777;
      color: white;
      display: none;
    }

    #cancelBtn:hover {
      background: #666;
    }

    #status {
      margin-top: 15px;
      font-weight: 600;
    }

    /* PRODUCTS */

    .products-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .products-title h2 {
      color: #333;
    }

    #productList {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .product {
      background: white;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
    }

    .product img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      background: #eee;
    }

    .product-info {
      padding: 18px;
    }

    .product-info h3 {
      margin-bottom: 10px;
      font-size: 19px;
    }

    .price {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .old-price {
      color: #888;
      text-decoration: line-through;
      margin-right: 5px;
    }

    .offer {
      color: #27ae60;
      margin-left: 5px;
    }

    .product-info p {
      color: #666;
      margin-bottom: 7px;
      line-height: 1.5;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 15px;
    }

    .edit {
      background: #3498db;
      color: white;
      flex: 1;
    }

    .delete {
      background: #e74c3c;
      color: white;
      flex: 1;
    }

    .edit:hover {
      background: #217dbb;
    }

    .delete:hover {
      background: #c0392b;
    }

    .loading,
    .empty {
      background: white;
      padding: 25px;
      border-radius: 12px;
      text-align: center;
      color: #777;
      grid-column: 1 / -1;
    }

    /* MOBILE */

    @media (max-width: 900px) {
      #productList {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 600px) {

      .topbar {
        flex-direction: column;
        align-items: stretch;
        text-align: center;
      }

      .container {
        padding: 15px;
      }

      .row {
        grid-template-columns: 1fr;
        gap: 0;
      }

      #productList {
        grid-template-columns: 1fr;
      }

      .form-card {
        padding: 18px;
      }

      .product img {
        height: 240px;
      }

      .login-card {
        padding: 25px 20px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       LOGIN
  ========================== -->

  <section id="loginBox">

    <div class="login-card">

      <h1>Gir Kitchenware Studio</h1>

      <p>Admin Panel Login</p>

      <label for="email">
        Email
      </label>

      <input
        type="email"
        id="email"
        placeholder="Admin Email"
        autocomplete="email"
      >

      <label for="password">
        Password
      </label>

      <input
        type="password"
        id="password"
        placeholder="Password"
        autocomplete="current-password"
      >

      <button id="loginBtn">
        🔐 Login
      </button>

      <div id="loginMessage"></div>

    </div>

  </section>


  <!-- =========================
       DASHBOARD
  ========================== -->

  <section id="dashboard">

    <!-- TOP BAR -->

    <header class="topbar">

      <h2>
        🛒 Gir Kitchenware Studio
      </h2>

      <button id="logoutBtn">
        🚪 Logout
      </button>

    </header>


    <main class="container">

      <!-- =========================
           PRODUCT FORM
      ========================== -->

      <div class="form-card">

        <h2 id="formTitle">
          ➕ Add Product
        </h2>

        <input
          type="hidden"
          id="productId"
        >

        <label for="name">
          Product Name *
        </label>

        <input
          type="text"
          id="name"
          placeholder="Example: Water Bottle"
        >


        <div class="row">

          <div>

            <label for="price">
              Original Price
            </label>

            <input
              type="number"
              id="price"
              placeholder="799"
              min="0"
            >

          </div>


          <div>

            <label for="offerPrice">
              Offer Price
            </label>

            <input
              type="number"
              id="offerPrice"
              placeholder="499"
              min="0"
            >

          </div>

        </div>


        <label for="category">
          Category
        </label>

        <input
          type="text"
          id="category"
          placeholder="Example: Kitchenware"
        >


        <label for="description">
          Product Description
        </label>

        <textarea
          id="description"
          placeholder="Product વિશે માહિતી લખો..."
        ></textarea>


        <label for="photo">
          Product Photo *
        </label>

        <input
          type="file"
          id="photo"
          accept="image/*"
        >


        <img
          id="preview"
          class="photo-preview"
          alt="Product Preview"
        >


        <div class="buttons">

          <button id="saveBtn">
            ➕ Add Product
          </button>

          <button id="cancelBtn">
            ❌ Cancel
          </button>

        </div>


        <div id="status"></div>

      </div>


      <!-- =========================
           PRODUCT LIST
      ========================== -->

      <div class="products-title">

        <h2>
          📦 Products
        </h2>

      </div>


      <div id="productList">
        <div class="loading">
          ⏳ Products loading...
        </div>
      </div>

    </main>

  </section>


  <!-- =========================
       FIREBASE + ADMIN JS
  ========================== -->

  <script type="module">

    /* =========================
       FIREBASE IMPORTS
    ========================== */

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    import {
      getFirestore,
      collection,
      addDoc,
      getDocs,
      doc,
      updateDoc,
      deleteDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

    import {
      getStorage,
      ref,
      uploadBytes,
      getDownloadURL,
      deleteObject
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-storage.js";


    /* =========================
       FIREBASE CONFIG
    ========================== */

    const firebaseConfig = {

      apiKey:
        "AIzaSyCsMqYCSwNPNpLsBqELJEMn3F-SASfa0lM",

      authDomain:
        "gir-kitchenware-studio.firebaseapp.com",

      projectId:
        "gir-kitchenware-studio",

      storageBucket:
        "gir-kitchenware-studio.firebasestorage.app",

      messagingSenderId:
        "691904856522",

      appId:
        "1:691904856522:web:885b408e89f26c73b70f33",

      measurementId:
        "G-4M27C2P958"
    };


    /* =========================
       INITIALIZE FIREBASE
    ========================== */

    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getFirestore(app);

    const storage = getStorage(app);


    /* =========================
       ELEMENTS
    ========================== */

    const loginBox =
      document.getElementById("loginBox");

    const dashboard =
      document.getElementById("dashboard");

    const loginBtn =
      document.getElementById("loginBtn");

    const logoutBtn =
      document.getElementById("logoutBtn");

    const loginMessage =
      document.getElementById("loginMessage");

    const status =
      document.getElementById("status");

    const saveBtn =
      document.getElementById("saveBtn");

    const cancelBtn =
      document.getElementById("cancelBtn");

    const productList =
      document.getElementById("productList");

    const photo =
      document.getElementById("photo");

    const preview =
      document.getElementById("preview");

    const productId =
      document.getElementById("productId");

    const nameInput =
      document.getElementById("name");

    const priceInput =
      document.getElementById("price");

    const offerPriceInput =
      document.getElementById("offerPrice");

    const categoryInput =
      document.getElementById("category");

    const descriptionInput =
      document.getElementById("description");


    let editingProduct = null;


    /* =========================
       LOGIN
    ========================== */

    loginBtn.addEventListener(
      "click",
      async () => {

        const email =
          document
            .getElementById("email")
            .value
            .trim();

        const password =
          document
            .getElementById("password")
            .value;


        if (!email || !password) {

          loginMessage.textContent =
            "Email અને Password નાખો.";

          return;
        }


        loginBtn.disabled = true;

        loginMessage.textContent =
          "Login થઈ રહ્યું છે...";


        try {

          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );

          loginMessage.textContent = "";

        } catch (error) {

          console.error(error);

          loginMessage.textContent =
            "❌ Login failed. Email અથવા Password ચેક કરો.";

        }


        loginBtn.disabled = false;

      }
    );


    /* =========================
       ENTER KEY LOGIN
    ========================== */

    document
      .getElementById("password")
      .addEventListener(
        "keydown",
        event => {

          if (event.key === "Enter") {
            loginBtn.click();
          }

        }
      );


    /* =========================
       AUTH STATE
    ========================== */

    onAuthStateChanged(
      auth,
      user => {

        if (user) {

          loginBox.style.display =
            "none";

          dashboard.style.display =
            "block";

          loadProducts();

        } else {

          loginBox.style.display =
            "flex";

          dashboard.style.display =
            "none";

        }

      }
    );


    /* =========================
       LOGOUT
    ========================== */

    logoutBtn.addEventListener(
      "click",
      async () => {

        try {

          await signOut(auth);

        } catch (error) {

          console.error(error);

        }

      }
    );


    /* =========================
       PHOTO PREVIEW
    ========================== */

    photo.addEventListener(
      "change",
      () => {

        const file =
          photo.files[0];


        if (!file) {

          preview.src = "";

          preview.style.display =
            "none";

          return;
        }


        if (!file.type.startsWith("image/")) {

          alert(
            "કૃપા કરીને image file પસંદ કરો."
          );

          photo.value = "";

          preview.src = "";

          preview.style.display =
            "none";

          return;
        }


        preview.src =
          URL.createObjectURL(file);

        preview.style.display =
          "block";

      }
    );


    /* =========================
       ADD / UPDATE PRODUCT
    ========================== */

    saveBtn.addEventListener(
      "click",
      async () => {

        const name =
          nameInput.value.trim();

        const price =
          priceInput.value.trim();

        const offerPrice =
          offerPriceInput.value.trim();

        const category =
          categoryInput.value.trim();

        const description =
          descriptionInput.value.trim();

        const file =
          photo.files[0];


        if (!name) {

          status.textContent =
            "❌ Product Name નાખો.";

          return;
        }


        if (!editingProduct && !file) {

          status.textContent =
            "❌ Product Photo પસંદ કરો.";

          return;
        }


        saveBtn.disabled = true;

        status.textContent =
          "⏳ Product save થઈ રહ્યું છે...";


        try {

          let imageUrl =
            editingProduct?.imageUrl || "";

          let storagePath =
            editingProduct?.storagePath || "";


          /* UPLOAD NEW IMAGE */

          if (file) {

            const safeFileName =
              file.name
                .replace(
                  /[^a-zA-Z0-9._-]/g,
                  "_"
                );


            const fileName =
              Date.now() +
              "_" +
              safeFileName;


            const storagePathNew =
              "products/" +
              fileName;


            const storageRef =
              ref(
                storage,
                storagePathNew
              );


            await uploadBytes(
              storageRef,
              file
            );


            imageUrl =
              await getDownloadURL(
                storageRef
              );


            storagePath =
              storagePathNew;


            /* DELETE OLD IMAGE */

            if (
              editingProduct &&
              editingProduct.storagePath
            ) {

              try {

                const oldRef =
                  ref(
                    storage,
                    editingProduct.storagePath
                  );

                await deleteObject(
                  oldRef
                );

              } catch (error) {

                console.log(
                  "Old image delete skipped."
                );

              }

            }

          }


          const productData = {

            name: name,

            price:
              Number(price || 0),

            offerPrice:
              Number(offerPrice || 0),

            category:
              category,

            description:
              description,

            imageUrl:
              imageUrl,

            storagePath:
              storagePath,

            updatedAt:
              serverTimestamp()

          };


          /* UPDATE */

          if (editingProduct) {

            await updateDoc(

              doc(
                db,
                "products",
                editingProduct.id
              ),

              productData

            );


            status.textContent =
              "✅ Product update થઈ ગયું.";

          }


          /* ADD */

          else {

            await addDoc(

              collection(
                db,
                "products"
              ),

              {

                ...productData,

                createdAt:
                  serverTimestamp()

              }

            );


            status.textContent =
              "✅ Product successfully add થઈ ગયું.";

          }


          resetForm();

          await loadProducts();


        } catch (error) {

          console.error(error);

          status.textContent =
            "❌ Error: " +
            error.message;

        }


        saveBtn.disabled = false;

      }
    );


    /* =========================
       LOAD PRODUCTS
    ========================== */

    async function loadProducts() {

      productList.innerHTML =
        `
          <div class="loading">
            ⏳ Products loading...
          </div>
        `;


      try {

        const snapshot =
          await getDocs(
            collection(
              db,
              "products"
            )
          );


        productList.innerHTML = "";


        if (snapshot.empty) {

          productList.innerHTML =
            `
              <div class="empty">
                હજુ કોઈ product નથી.
              </div>
            `;

          return;

        }


        snapshot.forEach(
          productDoc => {

            const product =
              productDoc.data();


            const card =
              document.createElement("div");

            card.className =
              "product";


            const originalPrice =
              Number(product.price || 0);

            const offerPrice =
              Number(product.offerPrice || 0);


            let priceHTML = "";


            if (
              originalPrice > 0 &&
              offerPrice > 0 &&
              offerPrice < originalPrice
            ) {

              priceHTML = `
                <div class="price">
                  <span class="old-price">
                    ₹${originalPrice}
                  </span>

                  <span class="offer">
                    ₹${offerPrice}
                  </span>
                </div>
              `;

            } else {

              priceHTML = `
                <div class="price">
                  ₹${originalPrice}
                </div>
              `;

            }


            card.innerHTML = `

              <img
                src="${escapeHtml(
                  product.imageUrl || ""
                )}"
                alt="${escapeHtml(
                  product.name || "Product"
                )}"
              >

              <div class="product-info">

                <h3>
                  ${escapeHtml(
                    product.name || ""
                  )}
                </h3>

                ${priceHTML}

                <p>
                  <strong>Category:</strong>
                  ${escapeHtml(
                    product.category || "-"
                  )}
                </p>

                <p>
                  ${escapeHtml(
                    product.description || ""
                  )}
                </p>

                <div class="actions">

                  <button
                    class="edit"
                    type="button"
                  >
                    ✏️ Edit
                  </button>

                  <button
                    class="delete"
                    type="button"
                  >
                    🗑️ Delete
                  </button>

                </div>

              </div>

            `;


            productList.appendChild(card);


            card
              .querySelector(".edit")
              .addEventListener(
                "click",
                () => {

                  editProduct(
                    productDoc.id,
                    product
                  );

                }
              );


            card
              .querySelector(".delete")
              .addEventListener(
                "click",
                () => {

                  deleteProduct(
                    productDoc.id,
                    product
                  );

                }
              );

          }
        );


      } catch (error) {

        console.error(error);

        productList.innerHTML =
          `
            <div class="empty">

              ❌ Products load થઈ શક્યા નથી.

              <br><br>

              ${escapeHtml(
                error.message
              )}

            </div>
          `;

      }

    }


    /* =========================
       EDIT PRODUCT
    ========================== */

    function editProduct(
      id,
      product
    ) {

      editingProduct = {

        id: id,

        ...product

      };


      productId.value =
        id;


      nameInput.value =
        product.name || "";


      priceInput.value =
        product.price || "";


      offerPriceInput.value =
        product.offerPrice || "";


      categoryInput.value =
        product.category || "";


      descriptionInput.value =
        product.description || "";


      photo.value = "";


      if (product.imageUrl) {

        preview.src =
          product.imageUrl;

        preview.style.display =
          "block";

      }


      document.getElementById(
        "formTitle"
      ).textContent =
        "✏️ Edit Product";


      saveBtn.textContent =
        "💾 Update Product";


      cancelBtn.style.display =
        "inline-block";


      status.textContent = "";


      window.scrollTo({

        top: 0,

        behavior: "smooth"

      });

    }


    /* =========================
       DELETE PRODUCT
    ========================== */

    async function deleteProduct(
      id,
      product
    ) {

      const confirmDelete =
        confirm(
          `શું "${product.name || "આ product"}" delete કરવો છે?`
        );


      if (!confirmDelete) {
        return;
      }


      try {

        status.textContent =
          "⏳ Product delete થઈ રહ્યું છે...";


        await deleteDoc(

          doc(
            db,
            "products",
            id
          )

        );


        if (product.storagePath) {

          try {

            await deleteObject(

              ref(
                storage,
                product.storagePath
              )

            );

          } catch (error) {

            console.log(
              "Photo delete skipped."
            );

          }

        }


        status.textContent =
          "🗑️ Product delete થઈ ગયું.";


        await loadProducts();


      } catch (error) {

        console.error(error);

        status.textContent =
          "❌ Delete Error: " +
          error.message;

      }

    }


    /* =========================
       CANCEL EDIT
    ========================== */

    cancelBtn.addEventListener(
      "click",
      () => {

        resetForm();

        status.textContent = "";

      }
    );


    /* =========================
       RESET FORM
    ========================== */

    function resetForm() {

      editingProduct =
        null;


      productId.value =
        "";


      nameInput.value =
        "";


      priceInput.value =
        "";


      offerPriceInput.value =
        "";


      categoryInput.value =
        "";


      descriptionInput.value =
        "";


      photo.value =
        "";


      preview.src =
        "";


      preview.style.display =
        "none";


      document.getElementById(
        "formTitle"
      ).textContent =
        "➕ Add Product";


      saveBtn.textContent =
        "➕ Add Product";


      cancelBtn.style.display =
        "none";

    }


    /* =========================
       HTML ESCAPE
    ========================== */

    function escapeHtml(value) {

      return String(value)

        .replaceAll(
          "&",
          "&amp;"
        )

        .replaceAll(
          "<",
          "&lt;"
        )

        .replaceAll(
          ">",
          "&gt;"
        )

        .replaceAll(
          '"',
          "&quot;"
        )

        .replaceAll(
          "'",
          "&#039;"
        );

    }

  </script>
