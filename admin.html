<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Gir Kitchenware Studio - Admin</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .login-box,
    .admin-panel {
      max-width: 1100px;
      margin: 40px auto;
      padding: 25px;
    }

    .login-box {
      max-width: 420px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 5px 25px rgba(0,0,0,.1);
    }

    h1 {
      margin-bottom: 20px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 13px;
      margin: 8px 0 15px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      border: 0;
      padding: 12px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .primary {
      background: #0b1f2a;
      color: white;
      width: 100%;
    }

    .logout {
      background: #d9534f;
      color: white;
    }

    .edit {
      background: #e0a800;
      color: white;
      margin-right: 5px;
    }

    .delete {
      background: #d9534f;
      color: white;
    }

    .dashboard {
      display: none;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      gap: 15px;
    }

    .form-box {
      background: white;
      padding: 25px;
      border-radius: 15px;
      margin-bottom: 30px;
      box-shadow: 0 5px 20px rgba(0,0,0,.06);
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 20px;
    }

    .product {
      background: white;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
    }

    .product img {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }

    .product-info {
      padding: 15px;
    }

    .product-info h3 {
      margin-bottom: 8px;
    }

    .price {
      font-size: 18px;
      font-weight: bold;
      margin: 8px 0;
    }

    .offer {
      color: #d35400;
    }

    .actions {
      margin-top: 12px;
    }

    #preview {
      width: 150px;
      height: 150px;
      object-fit: cover;
      border-radius: 10px;
      display: none;
      margin-bottom: 15px;
    }

    .message {
      margin: 10px 0;
      font-weight: bold;
    }

    @media(max-width:600px) {
      .login-box,
      .admin-panel {
        margin: 15px;
        padding: 15px;
      }

      .topbar {
        flex-direction: column;
        align-items: stretch;
      }
    }
  </style>
</head>

<body>

  <!-- LOGIN -->
  <div class="login-box" id="loginBox">

    <h1>🔐 Admin Login</h1>

    <input
      type="email"
      id="email"
      placeholder="Admin Email">

    <input
      type="password"
      id="password"
      placeholder="Password">

    <button
      class="primary"
      id="loginBtn">
      Login
    </button>

    <div class="message" id="loginMessage"></div>

  </div>


  <!-- ADMIN DASHBOARD -->
  <div class="admin-panel dashboard" id="dashboard">

    <div class="topbar">

      <h1>🛒 Product Admin Panel</h1>

      <button
        class="logout"
        id="logoutBtn">
        Logout
      </button>

    </div>


    <!-- PRODUCT FORM -->
    <div class="form-box">

      <h2 id="formTitle">➕ Add Product</h2>

      <input
        type="hidden"
        id="productId">

      <label>Product Photo</label>

      <input
        type="file"
        id="photo"
        accept="image/*">

      <img
        id="preview"
        alt="Preview">

      <input
        type="text"
        id="name"
        placeholder="Product Name">

      <input
        type="number"
        id="price"
        placeholder="Original Price">

      <input
        type="number"
        id="offerPrice"
        placeholder="Offer Price">

      <input
        type="text"
        id="category"
        placeholder="Category">

      <textarea
        id="description"
        placeholder="Product Description"></textarea>

      <button
        class="primary"
        id="saveBtn">
        Add Product
      </button>

      <button
        id="cancelBtn"
        style="display:none; margin-top:10px; width:100%;">
        Cancel Edit
      </button>

      <div
        class="message"
        id="status">
      </div>

    </div>


    <!-- PRODUCT LIST -->
    <h2>📦 Products</h2>

    <br>

    <div
      class="products"
      id="productList">
    </div>

  </div>


  <script type="module" src="admin.js"></script>

</body>
</html>
